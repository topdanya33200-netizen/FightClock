name: Server test

# Starts real Paper servers, joins two bot players and makes them fight: timers, blocked
# commands and teleports, logging out mid-fight, kicks, item cooldowns. See .github/server-test/run.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-test:
    name: Paper ${{ matrix.paper }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        paper: ['26.1', '26.3']
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build plugin
        run: ./gradlew jar

      - name: Fight on Paper ${{ matrix.paper }}
        run: .github/server-test/run.sh
        env:
          PAPER_LINE: ${{ matrix.paper }}
          GH_TOKEN: ${{ github.token }}

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-paper-${{ matrix.paper }}
          path: |
            build/server-test/server.log
          if-no-files-found: ignore
